name: Build PonWrt XG-040G-MD

# 触发方式：
#   1) 手动（可临时追加插件）
#   2) 推送改动 configs/an7581-md-user.config 或本工作流
#   3) 每周一 03:00 UTC 定时，跟随上游 PonWrt 更新
on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: '临时追加插件（空格分隔，如 luci-app-adguardhome）'
        required: false
        default: ''
      jobs:
        description: '编译并行度，留空用 nproc'
        required: false
        default: ''
  push:
    branches: [master, main]
    paths:
      - 'configs/an7581-md-user.config'
      - '.github/workflows/build-xg-040g-md.yml'
  schedule:
    - cron: '0 3 * * 1'

env:
  PONWRT_REPO: https://github.com/pbs05/ponwrt.git
  PONWRT_BRANCH: master
  CONFIG_FILE: configs/an7581-md-user.config
  DEVICE_SYMBOL: CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi
  DEVICE_NAME: nokia_xg-040g-md-ubi
  TZ: Asia/Shanghai

concurrency:
  group: xg040gmd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 XG-040G-MD
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /usr/share/swift || true
          sudo apt-get -qq clean
          df -h /

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd \
            zlib1g-dev zstd

      - name: 拉取 PonWrt 最新源码
        run: |
          git clone --depth 1 --branch "$PONWRT_BRANCH" "$PONWRT_REPO" ponwrt
          cd ponwrt
          echo "PONWRT_SHA=$(git rev-parse HEAD)"         >> "$GITHUB_ENV"
          echo "PONWRT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "PONWRT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
          echo "上游提交: $(git rev-parse --short HEAD) $(git log -1 --format=%s)"

      - name: 挂载第三方 feeds（均为最新 master）
        run: |
          cd ponwrt
          add_feed() {
            grep -q "src-git $1 " feeds.conf.default || echo "src-git $1 $2" >> feeds.conf.default
          }
          # QModem：4G/5G 模组管理
          add_feed qmodem https://github.com/FUjr/QModem.git
          # OpenClash 官方源
          add_feed openclash https://github.com/vernesong/OpenClash.git
          echo "----- feeds.conf.default -----"
          cat feeds.conf.default

      - name: 更新并安装 feeds（强制拉最新）
        run: |
          cd ponwrt
          ./scripts/feeds clean || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "----- 已装 feed -----"
          ./scripts/feeds list -i 2>/dev/null | head -5 || true
          echo "qmodem: $(ls feeds/qmodem/luci-app-qmodem 2>/dev/null | head -1)"
          echo "openclash: $(ls feeds/openclash/luci-app-openclash 2>/dev/null | head -1)"

      - name: 缓存 dl 源码包
        uses: actions/cache@v4
        with:
          path: ponwrt/dl
          key: dl-an7581-md-${{ github.run_id }}
          restore-keys: |
            dl-an7581-md-
            dl-an7581-

      - name: 应用配置
        run: |
          cd ponwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

          # 手动触发时临时追加插件
          if [ -n "${{ inputs.extra_packages }}" ]; then
            for p in ${{ inputs.extra_packages }}; do
              echo "CONFIG_PACKAGE_${p}=y" >> .config
              echo "追加插件: $p"
            done
          fi

          make defconfig

          # 机型校验
          if ! grep -q "^${DEVICE_SYMBOL}=y" .config; then
            echo "::error::设备 ${DEVICE_NAME} 未被选中"
            grep -i nokia .config || true
            exit 1
          fi
          echo "✅ 机型校验通过: ${DEVICE_NAME}"

          # CPU 调频内核支持校验
          grep -q "^CONFIG_ARM_AIROHA_SOC_CPUFREQ=y" target/linux/airoha/an7581/config-6.18 \
            && echo "✅ CPUFREQ 内核支持已开启" || echo "::warning::CPUFREQ 内核选项未找到"

      - name: 开启 NPU 流量统计（PPE）
        run: |
          cd ponwrt
          CFG=target/linux/airoha/an7581/config-6.18
          # 上游默认关闭 NET_AIROHA_FLOW_STATS，这里打开以启用 NPU/PPE 流量统计
          if grep -q "^CONFIG_NET_AIROHA_FLOW_STATS" "$CFG"; then
            sed -i 's/^# CONFIG_NET_AIROHA_FLOW_STATS is not set/CONFIG_NET_AIROHA_FLOW_STATS=y/' "$CFG"
            sed -i 's/^CONFIG_NET_AIROHA_FLOW_STATS=.*/CONFIG_NET_AIROHA_FLOW_STATS=y/' "$CFG"
          else
            echo "CONFIG_NET_AIROHA_FLOW_STATS=y" >> "$CFG"
          fi
          grep -n "NET_AIROHA" "$CFG"
          echo "✅ NPU 驱动(NET_AIROHA_NPU=y) + PPE 统计(FLOW_STATS=y) 已配置"

      - name: 插件命中校验
        run: |
          cd ponwrt
          miss=0; total=0
          while read -r p; do
            total=$((total+1))
            if grep -q "^CONFIG_PACKAGE_$p=y" .config; then
              echo "  OK   $p"
            else
              echo "  MISS $p"; miss=$((miss+1))
            fi
          done < <(grep -oP '^CONFIG_PACKAGE_\K[\w.+-]+(?==y)' "$GITHUB_WORKSPACE/$CONFIG_FILE")
          echo "::notice::插件共 ${total} 个，未命中 ${miss} 个（MISS 通常为包名不存在，不影响编译）"

      - name: 下载依赖源码
        run: |
          cd ponwrt
          J="${{ inputs.jobs }}"; [ -z "$J" ] && J=$(nproc)
          make download -j"$J" || make download -j1 V=s

      - name: 编译固件
        run: |
          cd ponwrt
          J="${{ inputs.jobs }}"; [ -z "$J" ] && J=$(nproc)
          echo "并行度: $J"
          if ! make -j"$J" V=s > build.log 2>&1; then
            echo "::error::编译失败，日志最后 150 行："
            tail -n 150 build.log
            exit 1
          fi
          tail -n 20 build.log

      - name: 整理产物
        run: |
          cd ponwrt
          OUT="$GITHUB_WORKSPACE/out"; mkdir -p "$OUT"
          find bin/targets/airoha/an7581 -maxdepth 1 -type f \
            \( -name "*xg-040g-md*" -o -name "sha256sums" -o -name "profiles.json" \) \
            -exec cp -v {} "$OUT/" \;
          if ! ls "$OUT" | grep -q xg-040g-md; then
            echo "::warning::未找到 md 专属镜像，改为拷贝全部产物"
            find bin/targets/airoha -maxdepth 2 -type f -exec cp -v {} "$OUT/" \;
          fi
          cd "$OUT"
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          echo "----- 产物 -----"; ls -lh
          echo "----- rootfs -----"
          ls -lh "$GITHUB_WORKSPACE"/ponwrt/bin/targets/airoha/an7581/*rootfs* 2>/dev/null || true

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-xg-040g-md-${{ env.PONWRT_SHORT }}-${{ github.run_number }}
          path: out/*
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xg040gmd-${{ github.run_number }}
          name: XG-040G-MD ${{ github.run_number }} (PonWrt ${{ env.PONWRT_SHORT }})
          body: |
            **Nokia XG-040G-MD** (Airoha AN7581DT) — PonWrt 固件

            - PonWrt 上游提交: `${{ env.PONWRT_SHORT }}` (${{ env.PONWRT_DATE }})
            - 插件: OpenClash / QModem / USB 驱动 / NPU+PPE / CPU 调频
            - NPU: `CONFIG_NET_AIROHA_NPU=y`，PPE 统计: `CONFIG_NET_AIROHA_FLOW_STATS=y`
            - 所有插件取自各 feed 最新 master

            刷机前请备份 `bosa`、`ri` 原厂分区。
          files: out/*
          fail_on_unmatched_files: true

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ponwrt/build.log
          retention-days: 7
